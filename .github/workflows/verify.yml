name: Verify

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and headless boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Godot version is pinned in .godot-version; the same script (checksum
      # verified) installs it for cloud sessions.
      - name: Install Godot
        run: echo "GODOT=$(bash tools/install_godot_linux.sh)" >> "$GITHUB_ENV"

      - name: Import project
        run: bash run_godot.sh --headless --path . --import

      - name: Tests
        run: bash run_tests.sh

      - name: Headless boot
        run: |
          output="$(bash run_godot.sh --headless --path . --quit 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|^ERROR:'; then
            echo "::error::Godot reported errors on boot"
            exit 1
          fi
